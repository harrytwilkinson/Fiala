<!doctype html>
<!-- Source for public/og-image.png, the 1200×630 card shown when a Fiala link is shared.

<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;

.pills{display:flex;gap:14px;flex-wrap:wrap;margin-top:26px}
.pill{font-size:26px;font-weight:600;padding:10px 22px;border-radius:999px;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.28)}
.foot{display:flex;justify-content:space-between;align-items:flex-end;font-size:28px;font-weight:600;color:#ccfbf1}
.foot b{color:#fff;font-size:32px}
</style></head><body><div class="glow"></div><div class="wrap">
<div class="top"><img src="../public/icons/icon-512.png" alt=""><span class="word">Fiala</span></div>
