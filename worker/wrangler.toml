# Fiala Plus unlock service. Deployed by .github/workflows/worker.yml.
name = "fiala-plus"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Serve it at plus.getfiala.com (Cloudflare creates the DNS record).
routes = [{ pattern = "plus.getfiala.com", custom_domain = true }]

# Not secret. A purchase only unlocks Plus if it came from this Payment Link.
# This is the live link; STRIPE_SECRET_KEY must be a live-mode restricted key.
[vars]
STRIPE_PAYMENT_LINK_ID = "plink_1UQ26KBgMDUpX9F00JjnhiNi"
