name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Nightly rebuild so the news feed stays fresh (times are UTC).
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a run that's already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build news feed
        run: npm run news
      - name: Fiala Plus public key
        env:
          PLUS_SIGNING_SECRET: ${{ secrets.PLUS_SIGNING_SECRET }}
        run: echo "VITE_PLUS_PUBLIC_KEY=$(npm run -s plus-key)" >> "$GITHUB_ENV"
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
