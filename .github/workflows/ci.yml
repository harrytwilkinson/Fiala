name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Checks the news sources still respond and parse; it only fails on a broken news/posts.json.
      - name: Build news feed
        run: npm run news
      - run: npm run build
