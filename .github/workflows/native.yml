name: Native apps

# Builds the iOS and Android apps so every change is checked on real native
# toolchains. Android produces installable debug APKs (full and store
# variants) as downloadable artifacts; iOS compiles for the simulator without
# signing. Store-ready signed builds are made locally (see NATIVE.md).

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [full, store]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build web app
        run: npm run ${{ matrix.variant == 'store' && 'build:store' || 'build' }}
      - run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fiala-android-${{ matrix.variant }}-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  ios:
    name: iOS (simulator build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build for iOS Simulator (unsigned)
        shell: bash # enables pipefail so an xcodebuild failure isn't hidden by tail
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -n 40
